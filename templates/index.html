<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedGuide AI — Medical Education Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" aria-label="Conversations">
    <div class="brand"><span class="brand-cross">✚</span><div><strong>MedGuide AI</strong><small>Medical education</small></div></div>
    <button id="newChat" type="button">＋ New chat</button>
    <nav id="convList" aria-label="Past conversations"></nav>
    <div class="side-foot">Educational guidance only — not a diagnosis. For severe symptoms, contact emergency services.</div>
  </aside>
  <div id="backdrop" hidden></div>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" type="button" aria-label="Open conversations">☰</button>
      <div class="top-title"><strong>MedGuide AI</strong><span>Knowledge base + web research</span></div>
      <span id="status" role="status">Checking…</span>
      <details class="tokenbox"><summary>API key</summary><input id="token" type="password" placeholder="API_TOKEN from .env" autocomplete="off"></details>
    </header>

    <div class="notice">⚕️ Educational guidance only. Not a diagnosis. For severe symptoms, contact emergency services.</div>

    <section id="messages" aria-live="polite"></section>

    <div id="preview" hidden>
      <img id="thumbnail" alt="Selected image">
      <button id="remove" type="button">Remove image ×</button>
    </div>

    <form id="chatForm">
      <textarea id="message" placeholder="Describe your symptoms or ask a question…" rows="2" required maxlength="4000"></textarea>
      <div class="toolbar">
        <label class="action" for="image" title="Attach image">📎 <span>Image</span></label>
        <input id="image" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <button class="action" id="camera" type="button" title="Use camera">📷 <span>Camera</span></button>
        <button class="action" id="mic" type="button" title="Voice input">🎤 <span>Voice</span></button>
        <button class="action" id="listen" type="button" title="Read last answer aloud">🔊 <span>Read</span></button>
        <button id="send" type="submit">Send ➜</button>
      </div>
    </form>
  </main>
</div>

<video id="video" autoplay playsinline hidden></video>
<div id="cameraActions" hidden><button id="snap" type="button">Capture</button><button id="closeCamera" type="button">Close</button></div>
<canvas id="canvas" hidden></canvas>

<script src="/static/app.js"></script>
</body>
</html>
