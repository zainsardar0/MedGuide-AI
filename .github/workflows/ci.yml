name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m py_compile app/main.py app/agent.py app/guardrails.py app/knowledge.py app/config.py

      - name: Keyless test suite
        # No API keys here by design: these tests cover guardrails, validators,
        # citations and confidence with deterministic fast-paths. The full
        # keyed eval (evals/evaluate.py) runs locally, not in CI.
        run: python -m pytest tests/ -q
        env:
          OPENAI_API_KEY: ""
          PINECONE_API_KEY: ""
          TAVILY_API_KEY: ""
